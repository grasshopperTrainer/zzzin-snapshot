# prod CD — Lightsail 인스턴스(zzzin-prod)로 배포.
#
# 구조: GHA 에서 linux/amd64 이미지 빌드 → docker save 를 SSH 파이프로 전송 → 인스턴스의
# forced-command 스크립트(zzzin-deploy-receive, zzzin-infra/lightsail/)가 load + compose up
# + 내부 헬스체크까지 수행. 레지스트리·Lightsail 컨테이너 API 미사용.
#
# snapshot 은 compose 내부 네트워크 전용(공개 엔드포인트 없음) — api 가
# http://snapshot:6666 으로 호출한다.
name: deploy-prod

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERSION: ${{ github.event.release.tag_name || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: zzzin-snapshot:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ZZZIN_PROD_SSH_KEY }}
          HOST_KEY: ${{ secrets.ZZZIN_PROD_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts

      - name: Ship image & deploy
        env:
          HOST: ${{ secrets.ZZZIN_PROD_HOST }}
        run: |
          docker save "zzzin-snapshot:$VERSION" | gzip | \
            ssh -i ~/.ssh/deploy_key ubuntu@"$HOST" "deploy snapshot $VERSION"
