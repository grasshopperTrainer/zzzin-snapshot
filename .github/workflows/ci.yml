name: CI

on:
  push:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # capturer 테스트가 실제 Chrome 을 띄움. npm ci postinstall 의 Chrome
      # 다운로드가 부분 실패로 빈 폴더만 남기면 재설치가 "이미 있음"으로 막히므로,
      # 캐시를 정리한 뒤 puppeteer 가 기대하는 빌드를 명시 설치한다.
      - run: rm -rf ~/.cache/puppeteer && npx puppeteer browsers install chrome

      - run: npm test

      - name: Build Docker image
        run: docker build -t zzzin-snapshot:test .
