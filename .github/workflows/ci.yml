name: CI

on:
  push:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # capturer 테스트가 실제 Chrome 을 띄움. puppeteer 내장 Chrome 다운로드는
      # 러너 환경에서 불안정하므로, production Dockerfile 과 동일하게 사전 설치된
      # 시스템 Chrome 을 PUPPETEER_EXECUTABLE_PATH 로 지정한다(ubuntu-latest 기본 제공).
      - run: echo "PUPPETEER_EXECUTABLE_PATH=$(which google-chrome)" >> "$GITHUB_ENV"

      - run: npm test

      - name: Build Docker image
        run: docker build -t zzzin-snapshot:test .
