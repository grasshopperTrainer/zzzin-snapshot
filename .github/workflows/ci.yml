name: CI

on:
  push:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # puppeteer 가 기대하는 Chrome 빌드를 러너 캐시(~/.cache/puppeteer)에 설치.
      # capturer 테스트가 실제 Chrome 을 띄우는데, 러너에는 미설치 → 명시 설치 필요.
      - run: npx puppeteer browsers install chrome

      - run: npm test

      - name: Build Docker image
        run: docker build -t zzzin-snapshot:test .
